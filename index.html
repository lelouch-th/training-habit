<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<meta name="theme-color" content="#0d1b2a">
<title>トレーニング記録</title>
<style>
  :root{
    --field:#12161c;        /* 背景(チャコール) */
    --field2:#1b212a;       /* パネル背景 */
    --line:#eef1f4;         /* 明るい面・数字 */
    --line-dim:#5c6672;     /* 補助線・弱い要素 */
    --accent:#4cb782;       /* アクセント(落ち着いた緑) */
    --accent-soft:#6fd0a0;
    --done:#eef1f4;         /* やった日の丸 */
    --ink:#e7ebf0;          /* 明るい文字 */
    --ink-dim:#8b95a3;      /* 弱い文字(ラベル・補助) */
    --ink-read:#bcc6d2;     /* 読ませる文章用(長文でも疲れない明るさ) */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c2530 0%, var(--field) 60%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","游ゴシック体",YuGothic,"Yu Gothic",sans-serif;
    min-height:100vh;
    padding:
      calc(env(safe-area-inset-top) + 20px)
      16px
      calc(env(safe-area-inset-bottom) + 32px);
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:460px;}

  header{text-align:center;margin-bottom:18px;}
  .title{
    font-size:15px;letter-spacing:.35em;color:var(--ink-dim);
    font-weight:600;margin:0 0 2px;padding-left:.35em;
  }
  .sub{font-size:12px;color:var(--line-dim);letter-spacing:.15em;}

  /* タブ */
  .tabs{
    display:flex;gap:0;background:#161b23;border:1px solid #2a323d;
    border-radius:12px;padding:4px;margin-bottom:16px;
  }
  .tab{
    flex:1;background:transparent;border:none;color:var(--ink-dim);
    font-size:14px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;
    letter-spacing:.12em;
  }
  .tab.active{background:var(--accent);color:#0e2419;}
  .pane[hidden]{display:none;}
  /* 記録タブ先頭のカレンダーは上余白を詰める */
  .pane .cal-head:first-child{margin-top:4px;}

  /* スコアボード風ストリーク */
  .board{
    background:linear-gradient(180deg,var(--field2),#161b23);
    border:1px solid #2a323d;
    border-radius:18px;
    padding:22px 20px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .board::before{ /* 上部アクセントライン */
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--accent);
    opacity:.9;
  }
  .streak-label{font-size:12px;letter-spacing:.3em;color:var(--ink-dim);margin-bottom:6px;}
  .streak-num{
    font-size:76px;line-height:1;font-weight:800;
    font-variant-numeric:tabular-nums;
    color:var(--line);
    text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .streak-num .unit{font-size:24px;font-weight:700;color:var(--ink-dim);margin-left:6px;}
  .streak-msg{margin-top:10px;font-size:13px;color:var(--accent-soft);min-height:18px;font-weight:600;}
  .streak-msg.calm{color:var(--ink-dim);font-weight:500;}

  /* 今日やったボタン */
  .cta{
    margin:20px 0 6px;width:100%;border:none;border-radius:16px;
    padding:20px;font-size:19px;font-weight:800;letter-spacing:.05em;
    color:#0e2419;cursor:pointer;transition:transform .08s ease,filter .15s ease;
    background:linear-gradient(180deg,var(--accent-soft),var(--accent));
    box-shadow:0 8px 20px rgba(76,183,130,.3);
  }
  .cta:active{transform:translateY(2px) scale(.995);}
  .cta.done{
    background:linear-gradient(180deg,#242c37,#1b212a);
    color:var(--line);box-shadow:none;border:1px solid #333d4a;
  }
  .cta.done .check{color:var(--accent-soft);margin-right:8px;}

  .undo{
    display:block;margin:4px auto 0;background:none;border:none;
    color:var(--line-dim);font-size:13px;cursor:pointer;padding:8px;
    text-decoration:underline;text-underline-offset:3px;
  }
  .undo:active{color:var(--ink-dim);}
  .undo[hidden]{display:none;}

  /* 昨日の記録(押し忘れ用) */
  .yday{
    display:block;width:100%;margin:10px auto 0;padding:12px;
    background:transparent;border:1px dashed #3a4553;border-radius:12px;
    color:var(--ink-dim);font-size:14px;cursor:pointer;font-family:inherit;
  }
  .yday:active{background:#1b2129;}
  .yday.done{border-style:solid;border-color:#2a323d;color:var(--line-dim);font-size:13px;}
  .yday[hidden]{display:none;}

  /* 今日のメニュー */
  .menu{
    margin-top:16px;background:var(--field2);border:1px solid #2a323d;
    border-radius:16px;padding:16px 16px 6px;
  }
  .menu-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .mnav{
    flex:0 0 auto;background:transparent;border:1px solid #2a323d;color:var(--ink);
    width:32px;height:32px;border-radius:9px;font-size:17px;line-height:1;cursor:pointer;padding:0;
  }
  .mnav:active{background:#252d38;}
  .menu-head{
    flex:1 1 auto;text-align:center;
    font-size:13px;font-weight:700;color:var(--accent-soft);
    letter-spacing:.05em;
  }
  .menu.rest .menu-head{color:var(--ink-dim);}
  .menu-today{
    display:block;margin:0 auto 12px;background:transparent;border:none;
    color:var(--line-dim);font-size:13px;cursor:pointer;padding:4px 8px;
    text-decoration:underline;text-underline-offset:3px;
  }
  .menu-today[hidden]{display:none;}
  /* モード切り替え */
  .mode-switch{
    display:flex;gap:0;background:#161b23;border:1px solid #2a323d;
    border-radius:10px;padding:3px;margin-bottom:12px;
  }
  .mode-btn{
    flex:1;background:transparent;border:none;color:var(--ink-dim);
    font-size:13px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;
  }
  .mode-btn.active{background:var(--accent);color:#0e2419;}
  .circuit-note{
    background:#161b23;border:1px solid #2a323d;border-radius:10px;
    padding:10px 12px;margin-bottom:12px;font-size:12px;
    color:var(--ink-dim);line-height:1.7;
  }
  .circuit-note[hidden]{display:none;}
  .circuit-note b{color:var(--accent-soft);font-weight:700;}
  .menu-aim{
    font-size:13.5px;line-height:1.85;color:var(--ink-read);
    border-left:2px solid #2f4a3c;padding:2px 0 2px 11px;margin:0 0 12px;
  }
  .menu-aim[hidden]{display:none;}
  .menu-rest-msg{color:var(--ink-dim);font-size:14px;padding-bottom:12px;}
  .ex{
    border-top:1px solid #262e38;
  }
  .ex:first-child{border-top:none;}
  .ex-row{display:flex;align-items:flex-start;gap:10px;}
  .chk{
    flex:0 0 auto;margin-top:11px;
    width:24px;height:24px;border-radius:7px;
    border:1.5px solid #3a4553;background:transparent;
    color:#0e2419;font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;transition:background .15s ease,border-color .15s ease;
  }
  .chk.on{background:var(--accent);border-color:var(--accent);}
  .ex-btn{
    flex:1 1 auto;min-width:0;
    background:none;border:none;color:var(--ink);
    text-align:left;padding:10px 2px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .ex-info{min-width:0;}
  .ex-name{display:block;font-size:15px;font-weight:600;}
  .ex-reps{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .chk.on + .ex-btn .ex-name{color:var(--ink-dim);text-decoration:line-through;}
  .ex-btn .arw{
    color:var(--ink-dim);font-size:12px;flex:0 0 auto;
    transition:transform .2s ease;
  }
  .ex-btn[aria-expanded="true"] .arw{transform:rotate(90deg);color:var(--accent-soft);}
  .ex-desc{
    display:none;color:var(--ink-read);font-size:14px;line-height:1.9;
    padding:0 4px 14px 30px;
  }
  .ex-desc.open{display:block;}
  .ex-desc-text{margin:0 0 12px;}
  .ex-effect-btn{
    display:flex;align-items:center;gap:8px;width:100%;
    margin:0 0 10px;padding:8px 10px;background:#1a2620;
    border:1px solid #2a3a32;border-radius:9px;cursor:pointer;
    font-family:inherit;text-align:left;
  }
  .ex-effect-btn:active{background:#22332b;}
  .ex-effect-label{
    flex:0 0 auto;padding:1px 7px;border-radius:5px;
    background:#2f4a3c;color:var(--accent-soft);font-size:11px;font-weight:700;
    letter-spacing:.08em;
  }
  .ex-effect-more{flex:1 1 auto;font-size:12px;color:var(--line-dim);}
  .ex-effect-arw{
    flex:0 0 auto;font-size:9px;color:var(--line-dim);
    transition:transform .15s ease;
  }
  .ex-effect-btn.open .ex-effect-arw{transform:rotate(90deg);}
  .ex-effect-body{
    display:none;margin:-4px 0 12px;padding:11px 12px;
    background:#1a2620;border-radius:9px;
    font-size:13.5px;line-height:1.9;color:var(--ink-read);
  }
  .ex-effect-body.open{display:block;}
  .ex-video{
    display:inline-block;color:var(--accent-soft);font-size:13px;
    text-decoration:none;border:1px solid #2f4a3c;border-radius:9px;
    padding:7px 12px;background:#1a2620;
  }
  .ex-video:active{background:#22332b;}
  .menu-done{
    text-align:center;color:var(--accent-soft);font-size:13px;
    font-weight:700;padding:10px 0 6px;
  }
  .menu-done[hidden]{display:none;}
  @media (prefers-reduced-motion: reduce){
    .ex-btn .arw{transition:none;}
    .chk{transition:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .ex-btn .arw{transition:none;}
  }

  /* 集計 */
  .stats{display:flex;gap:12px;margin:16px 0;}
  .stat{
    flex:1;background:var(--field2);border:1px solid #2a323d;border-radius:14px;
    padding:14px 10px;text-align:center;
  }
  .stat .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--line);}
  .stat .l{font-size:11px;color:var(--ink-dim);letter-spacing:.1em;margin-top:2px;}

  /* カレンダー */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 12px;}
  .cal-title{font-size:15px;font-weight:700;letter-spacing:.05em;}
  .nav{background:var(--field2);border:1px solid #2a323d;color:var(--ink);
    width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;line-height:1;}
  .nav:active{background:#252d38;}
  .nav:disabled{opacity:.3;cursor:default;}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow div{text-align:center;font-size:11px;color:var(--line-dim);padding:2px 0;}
  .dow .sun{color:#c98b8b;}
  .dow .sat{color:#89a7c4;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{
    aspect-ratio:1/1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-variant-numeric:tabular-nums;
    background:transparent;color:var(--ink-dim);position:relative;
  }
  .cell.empty{background:transparent;}
  .cell.done{
    background:var(--accent);color:#0e2419;font-weight:800;
  }
  .cell.today{outline:2px solid var(--accent);outline-offset:1px;}
  .cell.rest{color:var(--line-dim);}

  footer{margin-top:26px;text-align:center;color:var(--line-dim);font-size:11px;line-height:1.7;}
  .footer-note{color:#4d6076;}

  /* 統計グラフ */
  .chart-card{
    margin-top:22px;background:var(--field2);border:1px solid #2a323d;
    border-radius:16px;padding:16px;
  }
  .chart-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:.05em;}
  .chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bar-val{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
  .bar{
    width:100%;max-width:34px;border-radius:6px 6px 0 0;
    background:var(--accent);min-height:3px;transition:height .3s ease;
  }
  .bar.zero{background:#2a323d;}
  .bar.rest-dow{background:#3a4553;}
  .bar-label{font-size:11px;color:var(--line-dim);}
  .bar-label.rest-dow{color:#455160;}
  /* 8本並ぶグラフは幅が狭いので間隔と文字を詰める */
  .chart-8{gap:5px;}
  .chart-8 .bar{max-width:26px;}
  .chart-8 .bar-label{font-size:10px;letter-spacing:-.02em;}
  .chart-8 .bar-val{font-size:11px;}
  @media (prefers-reduced-motion: reduce){ .bar{transition:none;} }

  /* 今週の達成状況 */
  .week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px;}
  .wd{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .wd-name{font-size:11px;color:var(--line-dim);}
  .wd-name.rest-dow{color:#455160;}
  .wd-dot{
    width:100%;max-width:36px;aspect-ratio:1/1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-variant-numeric:tabular-nums;
    border:1.5px solid #3a4553;background:transparent;color:var(--ink-dim);
  }
  .wd-dot.done{background:var(--accent);border-color:var(--accent);color:#0e2419;font-weight:800;font-size:15px;}
  .wd-dot.rest{border-color:transparent;background:#242c37;color:#5c6672;font-size:11px;}
  .wd-dot.future{border-style:dashed;border-color:#333d4a;color:var(--line-dim);}
  .wd-dot.miss{border-color:#6b4a4a;color:#a07575;}
  .wd-dot.today{outline:2px solid var(--accent-soft);outline-offset:2px;}
  .week-sum{font-size:13px;color:var(--ink-dim);text-align:center;line-height:1.8;}
  .week-sum b{color:var(--accent-soft);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .week-sum .extra{display:block;font-size:12px;color:var(--line-dim);}

  /* 端末間の同期 */
  .sync{
    margin-top:16px;background:var(--field2);border:1px solid #2a323d;
    border-radius:16px;padding:16px;
  }
  .sync-title{font-size:12px;letter-spacing:.14em;color:var(--line-dim);margin-bottom:10px;}
  .sync-status{font-size:13px;color:var(--ink-dim);line-height:1.7;margin-bottom:12px;word-break:break-all;}
  .sync-status b{color:var(--accent-soft);font-weight:700;}
  .sync-status.err{color:#c98a8a;}
  .sync-actions{display:flex;gap:12px;}
  .sync .bk-btn{padding:11px;font-size:13px;}

  /* バックアップ */
  .backup{display:flex;gap:12px;margin-top:16px;}
  .bk-btn{
    flex:1;background:var(--field2);border:1px solid #2a323d;color:var(--ink);
    border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .bk-btn:active{background:#252d38;}

  /* 節目バナー */
  .banner{
    position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;
    transform:translateX(-50%) translateY(-24px);
    background:var(--accent);color:#0e2419;
    font-size:15px;font-weight:800;letter-spacing:.03em;
    padding:12px 22px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;z-index:50;white-space:nowrap;
    transition:opacity .3s ease, transform .3s ease;
  }
  .banner.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 押下時に数字が弾む */
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  .streak-num.pop{animation:pop .4s ease;}

  @media (prefers-reduced-motion: reduce){
    .banner{transition:opacity .2s ease;}
    .banner.show{transform:translateX(-50%) translateY(0);}
    .streak-num.pop{animation:none;}
  }
</style>
</head>
<body>
<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="wrap">
  <header>
    <p class="title">トレーニング記録</p>
    <p class="sub">小さな積み重ねを続ける</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="表示切り替え">
    <button class="tab active" id="tabToday" role="tab" aria-selected="true" aria-controls="paneToday">今日</button>
    <button class="tab" id="tabLog" role="tab" aria-selected="false" aria-controls="paneLog">記録</button>
  </nav>

  <div class="pane" id="paneToday" role="tabpanel" aria-labelledby="tabToday">

  <section class="board">
    <div class="streak-label">連続記録</div>
    <div class="streak-num"><span id="streakNum">0</span><span class="unit">日</span></div>
    <div class="streak-msg calm" id="streakMsg">今日から始めよう</div>
  </section>

  <section class="menu" id="menuCard">
    <div class="menu-nav">
      <button class="mnav" id="menuPrev" aria-label="前の曜日">‹</button>
      <div class="menu-head" id="menuHead">今日のメニュー</div>
      <button class="mnav" id="menuNext" aria-label="次の曜日">›</button>
    </div>
    <button class="menu-today" id="menuToday" hidden>今日へ戻る</button>
    <div class="menu-aim" id="menuAim"></div>
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn" id="modeStation" data-mode="station">ステーション</button>
      <button class="mode-btn" id="modeCircuit" data-mode="circuit">サーキット</button>
    </div>
    <div class="circuit-note" id="circuitNote" hidden></div>
    <div class="menu-body" id="menuBody"></div>
    <div class="menu-done" id="menuDone" hidden>🎉 今日のメニュー完了!</div>
  </section>

  <button class="cta" id="cta">今日やった</button>
  <button class="undo" id="undo" hidden>今日の記録を取り消す</button>
  <button class="yday" id="yday"></button>

  <div class="stats">
    <div class="stat"><div class="n" id="monthCount">0</div><div class="l">今月</div></div>
    <div class="stat"><div class="n" id="totalCount">0</div><div class="l">累計</div></div>
    <div class="stat"><div class="n" id="bestCount">0</div><div class="l">自己ベスト</div></div>
  </div>

  </div><!-- /paneToday -->

  <div class="pane" id="paneLog" role="tabpanel" aria-labelledby="tabLog" hidden>

  <div class="cal-head">
    <button class="nav" id="prev" aria-label="前の月">‹</button>
    <div class="cal-title" id="calTitle">2026年8月</div>
    <button class="nav" id="next" aria-label="次の月">›</button>
  </div>
  <div class="dow">
    <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
  </div>
  <div class="grid" id="grid"></div>

  <section class="chart-card">
    <div class="chart-title">月別の実施回数(直近6か月)</div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="chart-card">
    <div class="chart-title">曜日別の実施率(直近4週)</div>
    <div class="chart" id="dowChart"></div>
  </section>

  <section class="chart-card">
    <div class="chart-title">今週の達成状況</div>
    <div class="week-dots" id="weekDots"></div>
    <div class="week-sum" id="weekSum"></div>
  </section>

  <section class="chart-card">
    <div class="chart-title">週別の実施回数(直近8週)</div>
    <div class="chart chart-8" id="weekChart"></div>
  </section>

  <section class="sync" id="syncCard">
    <div class="sync-title">端末間の同期</div>
    <div class="sync-status" id="syncStatus">準備中…</div>
    <button class="bk-btn" id="signInBtn" hidden>Googleでログインして同期</button>
    <div class="sync-actions" id="syncActions" hidden>
      <button class="bk-btn" id="syncNowBtn">今すぐ同期</button>
      <button class="bk-btn" id="signOutBtn">ログアウト</button>
    </div>
  </section>

  <section class="backup">
    <button class="bk-btn" id="exportBtn">記録を書き出し</button>
    <button class="bk-btn" id="importBtn">記録を読み込み</button>

<script>
(function(){
  "use strict";

  var STORE_KEY = "training-habit-v1";
  var CHECK_KEY = "training-habit-checks-v1";
  var LOG_KEY   = "training-habit-log-v1";   // 同期用の操作ログ
  var storageOK = true;

  // ---- Firebase(端末間同期) ----
  // apiKeyは公開されても問題ない識別子。保護はFirestoreのセキュリティルールが担う
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDcujwB_PmE33L4PZZJwobJQc-7zTvc0zk",
    authDomain: "todo-app-3ccea.firebaseapp.com",

    appId: "1:352088559245:web:84c4fe55d7ea16eedddcc4"
  };
  var fb = null;   // { auth, db } SDKが使えないときはnullのまま
  function initFirebase(){

      var app = firebase.apps && firebase.apps.length
        ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
      return { auth: firebase.auth(), db: firebase.firestore(), app: app };

      return null;
    }
  }

  // ---- 同期用の操作ログ ----
  // 形式: { "2026-08-17": {v:1, t:1755...}, "2026-08-16": {v:0, t:1755...} }
  //   v:1=記録あり / v:0=取り消し済み  t=操作した時刻(ミリ秒)
  // 「取り消し」も履歴として残すことで、他端末から記録が復活するのを防ぐ
  function loadLog(){
    try{
      var raw = localStorage.getItem(LOG_KEY);
      if(!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && typeof obj === "object") ? obj : null;
    }catch(e){ return null; }
  }
  function saveLog(log){
    try{ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
    catch(e){ storageOK = false; }
  }
  // 既存の記録(日付キーだけのmap)から操作ログを作る。初回移行用
  function logFromRecords(map){
    var log = {};
    Object.keys(map).forEach(function(k){
      if(isValidDateKey(k) && map[k]) log[k] = { v:1, t:0 }; // t=0は「最も古い操作」
    });
    return log;
  }
  // 操作ログ → 実際の記録map(v:1のものだけ)
  function recordsFromLog(log){
    var map = {};
    Object.keys(log).forEach(function(k){
      if(log[k] && log[k].v === 1) map[k] = 1;
    });
    return map;
  }
  // 2つの操作ログを統合。同じ日付は「操作時刻が新しい方」を採用する
  function mergeLogs(a, b){
    var out = {};
    function put(log){
      Object.keys(log).forEach(function(k){
        var e = log[k];
        if(!e || typeof e !== "object" || (e.v !== 0 && e.v !== 1)) return;
        if(!isValidDateKey(k)) return;
        var t = (typeof e.t === "number" && isFinite(e.t)) ? e.t : 0;
        if(!out[k] || t > out[k].t) out[k] = { v:e.v, t:t };
      });
    }
    put(a || {});
    put(b || {});
    return out;
  }

  // ---- 保存/読み込み ----
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {};
      var obj = JSON.parse(raw);
      return (obj && typeof obj === "object") ? obj : {};
    }catch(e){ storageOK = false; return {}; }
  }
  function save(map){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(map)); }
    catch(e){ storageOK = false; }
  }

  function loadAllChecks(){

  }

  // ---- トレーニングモード(station/circuit)の読み書き ----
  function loadMode(){
    try{
      var m = localStorage.getItem(MODE_KEY);
      return (m === "circuit") ? "circuit" : "station"; // 既定はステーション
    }catch(e){ return "station"; }
  }
  function saveMode(m){

  }

  // ---- 日付ユーティリティ(すべてローカル時刻基準) ----
  function toKey(d){
    var y=d.getFullYear();
    var m=String(d.getMonth()+1).padStart(2,"0");
    var day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function keyToDate(k){
    var p=k.split("-").map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  }
  function todayDate(){
    var n=new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  // 実在する日付キー(YYYY-MM-DD)かを検証(13月・32日などを弾く)
  function isValidDateKey(k){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
    var p = k.split("-").map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.getFullYear()===p[0] && d.getMonth()===p[1]-1 && d.getDate()===p[2];
  }

  // その日が属する週の月曜日を返す(週は月曜始まり)
  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var w = x.getDay();                  // 0=日
    x.setDate(x.getDate() + (w===0 ? -6 : 1-w));
    return x;
  }

  // ---- ストリーク(1日の休みは許容、2日連続で途切れる) ----
  function calcStreak(map, today){
    var todayKey = toKey(today);
    var y = new Date(today); y.setDate(y.getDate()-1);
    var yKey = toKey(y);

    var cursor;
    if(map[todayKey]) cursor = keyToDate(todayKey);
    else if(map[yKey]) cursor = keyToDate(yKey);
    else return 0;

    var count = 1;
    while(true){
      var found = null;
      for(var gap=1; gap<=2; gap++){
        var prev = new Date(cursor); prev.setDate(prev.getDate()-gap);
        if(map[toKey(prev)]){ found = prev; break; }
      }
      if(!found) break;
      count++; cursor = found;
    }
    return count;
  }

  // ---- 自己ベスト(全期間の最長ストリーク。1日休みは継続) ----
  function bestStreak(map){
    var keys = Object.keys(map).sort(); // YYYY-MM-DD は文字列ソートで日付順
    if(keys.length===0) return 0;
    var best=1, cur=1;
    for(var i=1;i<keys.length;i++){
      var gap = Math.round((keyToDate(keys[i]) - keyToDate(keys[i-1]))/86400000);
      if(gap<=2) cur++; else cur=1;
      if(cur>best) best=cur;
    }
    return best;
  }

  var EXERCISES = {

    "片脚カーフレイズ":"片脚で立ち、反対の脚は膝を曲げて後ろに浮かせる。かかとをできるだけ高く上げてつま先立ちになり、一番上で1秒止める。かかとを床すれすれまでゆっくり下ろす。段差の縁で行うとかかとをより深く下ろせる。ふらつくなら壁に軽く手を添える。",
    "腕立て伏せ":"手を肩幅より少し広く床につき、体を一直線に保って胸を床に近づけ、押し戻す。きつければ膝を床につけて。",
    "パイクプッシュアップ":"手と足を床につき、お尻を高く上げて体で山型を作る。手は肩幅、頭を床に近づけるように肘を曲げ、押して戻る。きついときは手をイスや低い台の上に置くと、肩にかかる体重が減って楽になる。もっと軽くしたいなら、壁に手をついて立ったまま同じ動きをする。慣れたら床、さらに足を台に乗せると強度が上がる。",
    "YTWレイズ":"うつ伏せで額を床に近づけ、腕を3つの形で床から浮かせる。Y=腕を斜め前に伸ばしてYの字。T=腕を真横に開いてTの字。W=肘を曲げて脇を締め、Wの字。それぞれ10回ずつ行う。どの形も肩甲骨を背中の中央に寄せる意識で、反動を使わずゆっくり上げて下ろす。",
    "横向き肩外旋":"床に横向きに寝て、下の腕は頭の下へ。上側の腕を動かす。上側の肘を脇腹につけたまま90度に曲げ、手は体の前の床に置く(手の甲が床に触れる位置がスタート)。肘を脇から離さず、手だけを持ち上げて前腕が床と垂直になるまで開き、ゆっくり戻す。垂直より先へは無理に開かない。動画では軽いダンベルやチューブを使う例が多いが、動き方は同じなので器具なしでよい。",
    "素振り動作":"バットは持たず、握った手だけで素振りの動作を行う(室内では周囲の安全を確認)。足を肩幅より広く開いて構え、後ろ足で地面を押しながら腰から回し、その回転に上体と腕がついてくる順番で振り抜く。腕の力で振らないこと。逆方向にも同じ回数。速く鋭くを意識する。",
    "自重ローテーショナルジャンプ":"足を肩幅に開いて軽く膝を曲げ、体を横向き(半身)に構える。腕を振りながら真上に跳び、空中で体を90度ひねって正面向きで着地する。着地は膝を曲げて音を立てないように。一度止まって構え直し、同じ側へ繰り返す。決めた回数が終わったら反対向きにも同数。",
    "ジャンプスクワット":"足を肩幅に開き、太ももが床と平行になるくらいまでしゃがむ。腕を後ろに引いてから、振り上げる勢いも使って真上に跳ぶ。着地したら膝と股関節を曲げて衝撃を吸収し、そのまましゃがんだ姿勢へ。音を立てない着地を意識する。連続で跳ばず1回ずつ丁寧に。",

    "サイドプランク":"横向きに寝て、下の肘を肩の真下について上体を起こす。両脚は重ねて伸ばし、足の側面で床を支える。腰を持ち上げ、頭から足まで一直線をキープ。上側の手は腰に当てるか天井へ伸ばす。腰が下がりやすいので注意。きつければ膝を曲げて床につけると楽になる。",

  var PLAN = {

  var DOW_NAME = ["日","月","火","水","木","金","土"];

  var STRETCH = [

  function isRestDow(dow){ return !!(PLAN[dow] && PLAN[dow].rest); }

  var REST_TIME = {

  // サーキット(1セットずつ回す)の設定。周回数はプランのセット数から自動算出する

  // reps文字列を「回数部分」と「セット数」に分ける
  // 例:"片脚8〜12回×3" → {base:"片脚8〜12回", sets:3} / 「×N」がなければ sets:1
  function splitSets(reps){
    var m = String(reps).match(/^(.*?)×(\d+)$/);
    if(!m) return { base:String(reps), sets:1 };
    return { base:m[1], sets:Number(m[2]) };
  }
  // そのプランをサーキットで回すときの周回数(=最も多いセット数)
  function circuitRounds(plan){
    if(!plan || !plan.items) return 1;
    var max = 1;
    plan.items.forEach(function(it){
      var s = splitSets(it.reps).sets;
      if(s > max) max = s;

    return max;
  }
  var MODE_KEY = "training-habit-mode-v1"; // "station" | "circuit"

  // ---- 状態 ----
  var data = load();
  var opLog = loadLog() || logFromRecords(data);   // 初回はいまの記録から作る

  // 記録の追加/取り消しはこの関数に集約する(操作ログとクラウド保存を必ず伴わせるため)
  function setRecord(key, on, skipPush){
    if(on) data[key] = 1; else delete data[key];
    opLog[key] = { v: on ? 1 : 0, t: Date.now() };
    save(data);
    saveLog(opLog);
    if(!skipPush) pushToCloud();
  }

  // ---- 描画 ----
  function render(){
    var today = todayDate();
    var tKey = toKey(today);
    var didToday = !!data[tKey];

    // ストリーク
    var s = calcStreak(data, today);
    el.streakNum.textContent = s;

    // メッセージ(2連休警告を含む)
    var y = new Date(today); y.setDate(y.getDate()-1);
    var didYesterday = !!data[toKey(y)];
    var msg, calm=false;
    if(didToday){
      if(s>=2) msg = "この調子。途切れさせるな";
      else msg = "よし。まず1日";
    } else if(didYesterday && s>=1){
      msg = "昨日までの連続が生きている。今日やれば継続";
    } else if(!didYesterday && s===0 && Object.keys(data).length>0){
      // 一昨日以前に記録があり、昨日サボっている → 今日休むと2連休
      var yy = new Date(today); yy.setDate(yy.getDate()-2);
      if(data[toKey(yy)]) msg = "ここが踏ん張りどころ。今日やらないと2連休";
      else { msg = "今日から仕切り直そう"; calm=true; }
    } else {
      msg = "今日から始めよう"; calm=true;
    }
    el.streakMsg.textContent = msg;
    el.streakMsg.className = "streak-msg" + (calm?" calm":"");

    // ボタン
    if(didToday){
      el.cta.classList.add("done");
      el.cta.innerHTML = '<span class="check">✓</span>今日は記録済み';
      el.undo.hidden = false;
    } else {
      el.cta.classList.remove("done");
      el.cta.textContent = "今日やった";
      el.undo.hidden = true;
    }

    // 昨日の記録ボタン(押し忘れ対応。遡れるのは昨日まで)
    var yd = new Date(today); yd.setDate(yd.getDate()-1);
    var ydLabel = (yd.getMonth()+1) + "/" + yd.getDate() + " " + DOW_NAME[yd.getDay()];
    if(data[toKey(yd)]){
      el.yday.classList.add("done");
      el.yday.textContent = "昨日(" + ydLabel + ")は記録済み — 取り消す";
    } else {
      el.yday.classList.remove("done");
      el.yday.textContent = "昨日(" + ydLabel + ")の分を記録する";
    }

    // 集計
    var keys = Object.keys(data);
    el.totalCount.textContent = keys.length;
    var mPrefix = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
    el.monthCount.textContent = keys.filter(function(k){return k.indexOf(mPrefix)===0;}).length;
    el.bestCount.textContent = bestStreak(data);

    renderCalendar(today);
    renderChart(today);
    renderDowChart(today);
    renderWeekStatus(today);
    renderWeekChart(today);
  }

  // ---- 月別実施回数の棒グラフ(直近6か月) ----
  function renderChart(today){
    var n = 6;
    var labels = [];
    var y = today.getFullYear(), m = today.getMonth();
    for(var i=n-1;i>=0;i--){
      var d = new Date(y, m-i, 1);
      labels.push({
        key: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
        text: (d.getMonth()+1)+"月"
      });
    }
    var keys = Object.keys(data);
    var counts = labels.map(function(lab){
      return keys.filter(function(k){ return k.slice(0,7) === lab.key; }).length;
    });
    var max = Math.max.apply(null, counts);

    var html = "";
    for(var j=0;j<labels.length;j++){
      var c = counts[j];
      var h = (max>0 && c>0) ? Math.round(c/max*80) : 0; // 最大80px
      var barCls = c>0 ? "bar" : "bar zero";
      var barStyle = c>0 ? ("height:"+Math.max(h,3)+"px;") : "height:3px;";
      html += '<div class="bar-col">'
            +   '<div class="bar-val">'+c+'</div>'
            +   '<div class="'+barCls+'" style="'+barStyle+'"></div>'
            +   '<div class="bar-label">'+labels[j].text+'</div>'
            + '</div>';
    }
    el.chart.innerHTML = html;
  }

  // ---- 曜日別の実施率(直近4週=今日を含む28日) ----
  function renderDowChart(today){
    var num = [0,0,0,0,0,0,0]; // 実施した日数
    var den = [0,0,0,0,0,0,0]; // 対象になった日数
    for(var i=0;i<28;i++){
      var d = new Date(today); d.setDate(d.getDate()-i);
      var w = d.getDay();
      den[w]++;
      if(data[toKey(d)]) num[w]++;
    }
    var html = "";
    for(var j=0;j<7;j++){
      var w2 = DOW_ORDER_MON[j];                 // 月→日の順で並べる
      var rate = den[w2]>0 ? Math.round(num[w2]/den[w2]*100) : 0;
      var rest = isRestDow(w2);
      var h = Math.round(rate/100*80);           // 100%=80px
      var barCls = "bar" + (rate>0 ? (rest ? " rest-dow" : "") : " zero");
      var barStyle = "height:" + (rate>0 ? Math.max(h,3) : 3) + "px;";
      var labCls = "bar-label" + (rest ? " rest-dow" : "");
      html += '<div class="bar-col">'
            +   '<div class="bar-val">'+rate+'%</div>'
            +   '<div class="'+barCls+'" style="'+barStyle+'"></div>'
            +   '<div class="'+labCls+'">'+DOW_NAME[w2]+'</div>'
            + '</div>';
    }
    el.dowChart.innerHTML = html;
  }

  // ---- 今週の達成状況(月曜始まり。トレ予定日の達成を数える) ----
  function renderWeekStatus(today){
    var mon = mondayOf(today);
    var tKey = toKey(today);
    var planned = 0, achieved = 0, extra = 0;
    var html = "";

    for(var i=0;i<7;i++){
      var d = new Date(mon); d.setDate(d.getDate()+i);
      var k = toKey(d);
      var w = d.getDay();
      var rest = isRestDow(w);
      var done = !!data[k];
      // 今日はまだ実施できるので「これから(点線)」扱い。赤枠は過去の未実施だけ
      var pending = d.getTime() >= today.getTime();

      if(!rest) planned++;
      if(done){ if(rest) extra++; else achieved++; }

      var cls = "wd-dot";
      if(done) cls += " done";
      else if(rest) cls += " rest";
      else if(pending) cls += " future";
      else cls += " miss";
      if(k === tKey) cls += " today";

      var mark = done ? "✓" : (rest ? "休" : String(d.getDate()));
      html += '<div class="wd">'
            +   '<span class="wd-name'+(rest?" rest-dow":"")+'">'+DOW_NAME[w]+'</span>'
            +   '<span class="'+cls+'">'+mark+'</span>'
            + '</div>';
    }

    el.weekDots.innerHTML = html;
    var sum = 'トレ予定 '+planned+'日中 <b>'+achieved+'</b> 日達成';
    if(extra > 0) sum += '<span class="extra">休み日も '+extra+' 日実施</span>';
    el.weekSum.innerHTML = sum;
  }

  // ---- 週別の実施回数(今週を含む直近8週。週は月曜始まり) ----
  function renderWeekChart(today){
    var thisMon = mondayOf(today);
    var weeks = [];
    for(var i=7;i>=0;i--){
      var s = new Date(thisMon); s.setDate(s.getDate()-i*7);
      weeks.push(s);
    }
    var counts = weeks.map(function(s){
      var c = 0;
      for(var j=0;j<7;j++){
        var d = new Date(s); d.setDate(d.getDate()+j);
        if(data[toKey(d)]) c++;
      }
      return c;
    });
    var max = Math.max.apply(null, counts);

    var html = "";
    for(var k=0;k<weeks.length;k++){
      var c2 = counts[k];
      var h = (max>0 && c2>0) ? Math.round(c2/max*80) : 0;   // 最大80px
      var barCls = c2>0 ? "bar" : "bar zero";
      var barStyle = "height:" + (c2>0 ? Math.max(h,3) : 3) + "px;";
      var lab = (weeks[k].getMonth()+1) + "/" + weeks[k].getDate();
      html += '<div class="bar-col">'
            +   '<div class="bar-val">'+c2+'</div>'
            +   '<div class="'+barCls+'" style="'+barStyle+'"></div>'
            +   '<div class="bar-label">'+lab+'</div>'
            + '</div>';
    }
    el.weekChart.innerHTML = html;
  }

  function renderCalendar(today){
    el.calTitle.textContent = viewYear+"年"+(viewMonth+1)+"月";

    var first = new Date(viewYear, viewMonth, 1);
    var startDow = first.getDay(); // 0=日
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var tKey = toKey(today);

    var html = "";
    for(var i=0;i<startDow;i++) html += '<div class="cell empty"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var dateObj = new Date(viewYear, viewMonth, d);
      var k = toKey(dateObj);
      var cls = "cell";
      if(data[k]) cls += " done";
      if(k===tKey) cls += " today";
      html += '<div class="'+cls+'">'+d+'</div>';
    }
    el.grid.innerHTML = html;

    // 未来の月へは進めない(今日を含む月まで)
    var today0 = todayDate();
    var isCurrentOrFuture = (viewYear>today0.getFullYear()) ||
      (viewYear===today0.getFullYear() && viewMonth>=today0.getMonth());
    el.next.disabled = isCurrentOrFuture;
  }

  // ---- メニュー描画(viewDowの曜日を表示。今日以外は閲覧のみ) ----
  function renderMenu(){
    var today = todayDate();
    var todayDow = today.getDay();
    var dow = viewDow;
    var isToday = (dow === todayDow);
    var plan = PLAN[dow];

    el.menuBody.innerHTML = "";
    el.menuDone.hidden = true;
    el.menuToday.hidden = isToday; // 今日を見ているときは戻るボタン不要

    // 選択中のモードをボタンの見た目に反映
    var isCircuit = (viewMode === "circuit");
    el.modeStation.classList.toggle("active", !isCircuit);
    el.modeCircuit.classList.toggle("active", isCircuit);
    el.modeStation.setAttribute("aria-pressed", isCircuit ? "false" : "true");
    el.modeCircuit.setAttribute("aria-pressed", isCircuit ? "true" : "false");

    // 見出しの接頭辞:今日なら「今日の」、それ以外は曜日名

    // その日の狙い(回復日にも表示する)
    if(plan.aim){
      el.menuAim.textContent = plan.aim;
      el.menuAim.hidden = false;
    } else {
      el.menuAim.hidden = true;
    }

    if(plan.rest){
      el.menuCard.classList.add("rest");
      el.menuHead.textContent = headPrefix + "(回復日)";
      el.modeSwitch.hidden = true;   // 回復日はモード切替・案内を出さない
      el.circuitNote.hidden = true;
      var p = document.createElement("div");
      p.className = "menu-rest-msg";
      p.textContent = "回復日。下のストレッチを気が向いた分だけ。記録の対象外です。";
      el.menuBody.appendChild(p);

      // ストレッチ一覧(チェックボックスなし。解説だけ開閉できる)
      STRETCH.forEach(function(it){
        var wrapS = document.createElement("div");
        wrapS.className = "ex";
        var rowS = document.createElement("div");
        rowS.className = "ex-row";

        var btnS = document.createElement("button");
        btnS.className = "ex-btn";
        btnS.setAttribute("aria-expanded", "false");
        var infoS = document.createElement("span");
        infoS.className = "ex-info";
        var nmS = document.createElement("span");
        nmS.className = "ex-name";
        nmS.textContent = it.name;
        var rpS = document.createElement("span");
        rpS.className = "ex-reps";
        rpS.textContent = it.reps;
        infoS.appendChild(nmS);
        infoS.appendChild(rpS);
        var arwS = document.createElement("span");
        arwS.className = "arw";
        arwS.textContent = "▶";
        btnS.appendChild(infoS);
        btnS.appendChild(arwS);

        var descS = buildDesc(it.name);
        btnS.addEventListener("click", function(){
          var willOpen = !descS.classList.contains("open");
          if(willOpen) closeOtherDescs(btnS);   // 開くときだけ、他を閉じる
          var openS = descS.classList.toggle("open");
          btnS.setAttribute("aria-expanded", openS ? "true" : "false");
        });

        rowS.appendChild(btnS);
        wrapS.appendChild(rowS);
        wrapS.appendChild(descS);
        el.menuBody.appendChild(wrapS);
      });
      return;
    }

    el.modeSwitch.hidden = false;
    // サーキット時だけ、回し方の案内を表示(周回数はプランのセット数から算出)
    var rounds = circuitRounds(plan);
    if(isCircuit){
      el.circuitNote.innerHTML =
        "全種目を1セットずつ順に行い、最大<b>" + rounds + "周</b>。<br>" +
        "各種目の「◯周目まで」に従い、達したものは以降スキップ。<br>" +
        "種目のあいだ<b>" + CIRCUIT.betweenExercises + "</b> / 1周終えたら<b>" + CIRCUIT.betweenRounds + "</b>休む。";
      el.circuitNote.hidden = false;
    } else {
      el.circuitNote.hidden = true;
    }

    el.menuCard.classList.remove("rest");
    el.menuHead.textContent = headPrefix + "(" + plan.label + ")";

    // チェックは「今日」だけ有効。今日の記録に紐づく
    var todayKey = toKey(today);
    var allChecks = loadAllChecks();
    var todayChecks = allChecks[todayKey] || {};

    function persist(){
      allChecks[todayKey] = todayChecks;
      saveAllChecks(allChecks);
    }
    function updateDone(){
      if(!isToday){ el.menuDone.hidden = true; return; }
      var all = plan.items.every(function(it){ return todayChecks[it.name]; });
      el.menuDone.hidden = !all;
    }

    plan.items.forEach(function(it){
      var wrap = document.createElement("div");
      wrap.className = "ex";

      var row = document.createElement("div");
      row.className = "ex-row";

      // チェックボタンは今日のみ表示(他曜日は閲覧のみ)
      if(isToday){
        var on0 = !!todayChecks[it.name];
        var chk = document.createElement("button");
        chk.className = "chk" + (on0 ? " on" : "");
        chk.setAttribute("role", "checkbox");
        chk.setAttribute("aria-checked", on0 ? "true" : "false");
        chk.setAttribute("aria-label", it.name);
        chk.textContent = on0 ? "✓" : "";
        chk.addEventListener("click", function(){
          var on = !todayChecks[it.name];
          if(on) todayChecks[it.name] = 1; else delete todayChecks[it.name];
          chk.classList.toggle("on", on);
          chk.textContent = on ? "✓" : "";
          chk.setAttribute("aria-checked", on ? "true" : "false");
          persist();
          updateDone();
        });
        row.appendChild(chk);
      }

      var btn = document.createElement("button");
      btn.className = "ex-btn";
      btn.setAttribute("aria-expanded", "false");
      var info = document.createElement("span");
      info.className = "ex-info";
      var nm = document.createElement("span");
      nm.className = "ex-name";
      nm.textContent = it.name;
      var rp = document.createElement("span");
      rp.className = "ex-reps";
      if(isCircuit){
        // サーキット:セット数を周回数として表示(例「片脚8〜12回 · 3周目まで」)
        var sp = splitSets(it.reps);
        rp.textContent = sp.base + " · " + sp.sets + "周目まで";
      } else if(REST_TIME[it.name]){
        // ステーション:セット間休憩も表示
        rp.textContent = it.reps + " / 休憩" + REST_TIME[it.name];
      } else {
        rp.textContent = it.reps;
      }
      info.appendChild(nm);
      info.appendChild(rp);
      var arw = document.createElement("span");
      arw.className = "arw";
      arw.textContent = "▶";
      btn.appendChild(info);
      btn.appendChild(arw);

      var desc = buildDesc(it.name);

      btn.addEventListener("click", function(){
        var willOpen = !desc.classList.contains("open");
        if(willOpen) closeOtherDescs(btn);   // 開くときだけ、他を閉じる
        var open = desc.classList.toggle("open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });

      row.appendChild(btn);
      wrap.appendChild(row);
      wrap.appendChild(desc);
      el.menuBody.appendChild(wrap);
    });

    updateDone();
  }

  // ---- 端末間の同期 ----
  var currentUser = null;
  var syncing = false;
  var lastSyncAt = null;

  function setSyncStatus(text, isErr){
    el.syncStatus.innerHTML = text;
    el.syncStatus.className = "sync-status" + (isErr ? " err" : "");
  }
  function fmtTime(d){
    return (d.getMonth()+1)+"/"+d.getDate()+" "
      + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function renderSyncUI(){
    // ログインしていれば他端末に引き継がれるので、フッターの案内も切り替える
    if(currentUser){
      el.footerNote.innerHTML = "記録はこの端末とクラウドの両方に保存されます。<br>"
        + '<span class="footer-note">同じGoogleアカウントでログインした端末に引き継がれます</span>';
    } else {
      el.footerNote.innerHTML = "記録はこの端末のブラウザ内に保存されます。<br>"
        + '<span class="footer-note">機種変更・別ブラウザには引き継がれません</span>';
    }
    if(!fb){
      setSyncStatus("この端末では同期を利用できません。<br>通信環境を確認して再読み込みしてください。", true);
      el.signInBtn.hidden = true;
      el.syncActions.hidden = true;
      return;
    }
    if(currentUser){
      el.signInBtn.hidden = true;
      el.syncActions.hidden = false;
      var t = syncing ? "同期中…"
        : (lastSyncAt ? "最終同期 <b>" + fmtTime(lastSyncAt) + "</b>" : "未同期");
      setSyncStatus(currentUser.email + "<br>" + t);
    } else {
      el.signInBtn.hidden = false;
      el.syncActions.hidden = true;
      setSyncStatus("未ログイン。記録はこの端末にのみ保存されます。<br>ログインすると他の端末と記録を共有できます。");
    }
  }

  // クラウドへ送信(ログイン時のみ)
  function pushToCloud(){
    if(!fb || !currentUser) return;
    fb.db.collection("training").doc(currentUser.uid)
      .set({ log: opLog, updatedAt: Date.now() })
      .then(function(){
        lastSyncAt = new Date();
        renderSyncUI();
      })
      .catch(function(e){
        setSyncStatus("保存に失敗しました。<br>" + (e && e.message ? e.message : ""), true);
      });
  }

  // クラウドと統合(取得 → マージ → 反映 → 送信)
  function syncWithCloud(){
    if(!fb || !currentUser || syncing) return;
    syncing = true;
    renderSyncUI();
    fb.db.collection("training").doc(currentUser.uid).get()
      .then(function(snap){
        var remote = (snap.exists && snap.data() && snap.data().log) ? snap.data().log : {};
        var merged = mergeLogs(opLog, remote);
        opLog = merged;
        data = recordsFromLog(merged);
        save(data);
        saveLog(opLog);
        render();
        renderMenu();
        return fb.db.collection("training").doc(currentUser.uid)
          .set({ log: opLog, updatedAt: Date.now() });
      })
      .then(function(){
        syncing = false;
        lastSyncAt = new Date();
        renderSyncUI();
      })
      .catch(function(e){
        syncing = false;
        setSyncStatus("同期に失敗しました。<br>" + (e && e.message ? e.message : ""), true);
      });
  }

  fb = initFirebase();
  if(fb){
    fb.auth.onAuthStateChanged(function(user){
      currentUser = user || null;
      renderSyncUI();
      if(currentUser) syncWithCloud();
    });
    el.signInBtn.addEventListener("click", function(){
      var provider = new firebase.auth.GoogleAuthProvider();
      fb.auth.signInWithPopup(provider).catch(function(e){
        // ポップアップが塞がれる環境ではリダイレクト方式に切り替える
        if(e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")){
          fb.auth.signInWithRedirect(provider);
          return;
        }
        if(e && e.code === "auth/popup-closed-by-user") return; // 利用者が閉じただけ
        setSyncStatus("ログインに失敗しました。<br>" + (e && e.message ? e.message : ""), true);
      });
    });
    el.signOutBtn.addEventListener("click", function(){
      fb.auth.signOut().catch(function(){});
    });
    el.syncNowBtn.addEventListener("click", syncWithCloud);
  }
  renderSyncUI();

  // YouTube検索で使う語の上書き表
  // 種目名がそのままでは検索に適さないもの(一般的な呼び方と違う等)だけ指定する
  var SEARCH_QUERY = {
    "横向き肩外旋":"エクスターナルローテーション 横向き 寝て やり方",
    "自重ローテーショナルジャンプ":"ジャンプツイスト トレーニング やり方",
    "素振り動作":"野球 素振り フォーム 練習",
    "ハムストリングス伸ばし":"ハムストリングス ストレッチ 仰向け",
    "YTWレイズ":"YTW エクササイズ うつ伏せ 肩甲骨",
    "股関節まわし":"股関節 回す ストレッチ 立ったまま",
    "胸開きストレッチ":"大胸筋 ストレッチ 壁 やり方",
    "首・肩まわし":"首 肩 まわす ストレッチ やり方"
  };

  // 種目ごとの効果(鍛えられる部位と、それが何の役に立つか)
  var EFFECTS = {
    "ブルガリアンスクワット":"太もも前(大腿四頭筋)とお尻(大臀筋)。片脚ずつ行うので左右の筋力差が是正され、バランス能力も同時に鍛えられる。両脚のスクワットより1本あたりの負荷が高い。",
    "サイドランジ":"内もも(内転筋)とお尻の側面(中臀筋)。横方向の動きを鍛える数少ない種目で、前後の動きだけでは鍛えられない部分を補う。守備の横の一歩や切り返しに効く。",
    "素振り動作":"腹斜筋を中心とした回旋の筋力と、下半身から上半身への力の伝達。筋肉を大きくするというより、力を無駄なく伝える動作を身につける種目。",
    "プランク":"体幹全体(腹横筋・腹直筋・背筋)。姿勢を保つ力が付き、他のすべての種目の土台になる。腰への負担が少ないのも利点。",
    "片脚ヒップリフト":"お尻(大臀筋)と太もも裏(ハムストリングス)。座っている時間が長いと使われにくいお尻を目覚めさせる。腰痛の予防にもつながる。",
    "片脚カーフレイズ":"ふくらはぎ(下腿三頭筋)。足首の安定性が上がり、走る・跳ぶ動作の土台になる。捻挫の予防にも役立つ。",
    "腕立て伏せ":"胸(大胸筋)、肩の前(三角筋前部)、二の腕の裏(上腕三頭筋)。体を一直線に保つため体幹も同時に使う、上半身の基本種目。",
    "パイクプッシュアップ":"肩(三角筋の前部・中部)。腕立て伏せより肩に体重が乗るので、器具なしで肩を集中的に鍛えられる数少ない種目。",
    "YTWレイズ":"背中の中央(僧帽筋の中部・下部、菱形筋)。肩甲骨を寄せる筋力が付き、猫背・巻き肩の改善につながる。投球時の肩の安定にも直結する。",
    "横向き肩外旋":"肩の奥のインナーマッスル(棘下筋・小円筋)。外からは見えない小さな筋肉だが、肩関節を正しい位置に保つ役割があり、投げる動作による肩の故障予防に重要。",
    "ジャンプスクワット":"下半身の瞬発力。ゆっくり動くスクワットでは鍛えられない「素早く強い力を出す能力」を養う。走り出しや跳躍に効く。",
    "自重ローテーショナルジャンプ":"跳ぶ力とひねる力の組み合わせ。空中での姿勢を保つ力と、着地で体を止める力が付く。方向転換の多い動きに効く。",
    "サイドプランク":"脇腹(腹斜筋)と体幹の側面。体が横に倒れるのを防ぐ力が付き、回旋動作の土台になる。プランクと組み合わせると体幹を多方向から鍛えられる。",
    "デッドバグ":"手脚を動かしながら体幹をぶらさずに保つ力。腰を守ったまま鍛えられるので、腰に不安がある人でも取り組みやすい。",
    "バードドッグ":"体幹の安定性とお尻・背中の筋力。対角の手脚を動かすため、実際のスポーツ動作に近い形で体幹を鍛えられる。",
    "キャット&カウ":"背骨の柔軟性、特に胸椎(背中の中央)の動き。ここが硬いと体をひねる動作を腰が肩代わりしてしまい、腰痛の原因になる。",
    "チャイルドポーズ":"背中から腰にかけての伸展と、緊張の緩和。呼吸を深くしやすく、トレーニング後の切り替えにも向く。",
    "ハムストリングス伸ばし":"太もも裏の柔軟性。ここが硬いと骨盤が後ろに傾き、腰痛や前かがみ姿勢の原因になる。脚を後ろに伸ばす動きも出やすくなる。",
    "股関節まわし":"股関節の可動域。股関節は体をひねる力の出どころなので、ここが動くほど回旋動作が楽になる。",
    "胸開きストレッチ":"胸の前側(大胸筋・小胸筋)の柔軟性。ここが硬いと肩が前に巻き込まれ、腕を上げにくくなる。押す種目の後に入れると効果的。",
    "首・肩まわし":"首と肩まわりの血流改善と緊張の緩和。デスクワークで固まりやすい部分をほぐし、肩の動きを取り戻す。"
  };

  // 種目の解説を開くとき、他に開いている解説を閉じる(1つだけ開いた状態にする)
  function closeOtherDescs(exceptBtn){
    var btns = el.menuBody.querySelectorAll(".ex-btn");
    for(var i=0;i<btns.length;i++){
      if(btns[i] === exceptBtn) continue;
      btns[i].setAttribute("aria-expanded", "false");
      var wrap = btns[i].closest(".ex");
      if(!wrap) continue;
      var d = wrap.querySelector(".ex-desc");
      if(d) d.classList.remove("open");
      // 閉じるときは中の「効果」も畳んでおく(次に開いたとき初期状態に戻す)
      var eb = wrap.querySelector(".ex-effect-body");
      var ebtn = wrap.querySelector(".ex-effect-btn");
      if(eb) eb.classList.remove("open");
      if(ebtn){ ebtn.classList.remove("open"); ebtn.setAttribute("aria-expanded","false"); }
    }
  }

  // 種目の解説欄を作る(解説文 + YouTube検索リンク)
  // 個別の動画URLではなく検索リンクにすることで、動画が削除されてもリンク切れしない
  function buildDesc(name){
    var box = document.createElement("div");
    box.className = "ex-desc";

    var p = document.createElement("p");
    p.className = "ex-desc-text";
    p.textContent = EXERCISES[name] || "";
    box.appendChild(p);

    // 効果(登録がある種目だけ。最初は閉じておき、タップで開く)
    if(EFFECTS[name]){
      var efBtn = document.createElement("button");
      efBtn.className = "ex-effect-btn";
      efBtn.setAttribute("aria-expanded", "false");
      efBtn.innerHTML = '<span class="ex-effect-label">効果</span>'
                      + '<span class="ex-effect-more">この種目で何が鍛えられる?</span>'
                      + '<span class="ex-effect-arw">▶</span>';

      var efBody = document.createElement("div");
      efBody.className = "ex-effect-body";
      efBody.textContent = EFFECTS[name];

      efBtn.addEventListener("click", function(ev){
        ev.stopPropagation();   // 解説そのものが閉じないようにする
        var opened = efBody.classList.toggle("open");
        efBtn.classList.toggle("open", opened);
        efBtn.setAttribute("aria-expanded", opened ? "true" : "false");
      });

      box.appendChild(efBtn);
      box.appendChild(efBody);
    }

    var a = document.createElement("a");
    a.className = "ex-video";
    // 上書き表にあればそれを使い、なければ種目名から検索語を組み立てる
    var q = SEARCH_QUERY[name];
    if(!q){
      var isStretch = STRETCH.some(function(s){ return s.name === name; });
      var suffix;
      if(!isStretch)                       suffix = " フォーム やり方";
      else if(name.indexOf("ストレッチ") >= 0) suffix = " やり方";   // 名前に含まれる場合は重複させない
      else                                 suffix = " ストレッチ やり方";
      q = name + suffix;
    }
    a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "▶ 参考動画を検索する";
    // リンクを押したときに解説の開閉が起きないようにする
    a.addEventListener("click", function(ev){ ev.stopPropagation(); });
    box.appendChild(a);

    return box;
  }

  // ---- 演出 ----
  var bannerTimer = null;
  function showBanner(text){
    el.banner.textContent = text;
    el.banner.classList.add("show");
    if(bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function(){
      el.banner.classList.remove("show");
    }, 2600);
  }
  function popStreak(){
    el.streakNum.classList.remove("pop");
    // リフローを挟んでアニメを確実に再生
    void el.streakNum.offsetWidth;
    el.streakNum.classList.add("pop");
  }

  // ---- タブ切り替え ----
  function switchTab(name){
    var toToday = (name !== "log");
    el.paneToday.hidden = !toToday;
    el.paneLog.hidden = toToday;
    el.tabToday.classList.toggle("active", toToday);
    el.tabLog.classList.toggle("active", !toToday);
    el.tabToday.setAttribute("aria-selected", toToday ? "true" : "false");
    el.tabLog.setAttribute("aria-selected", toToday ? "false" : "true");
    window.scrollTo(0, 0);
  }
  el.tabToday.addEventListener("click", function(){ switchTab("today"); });
  el.tabLog.addEventListener("click", function(){ switchTab("log"); });

  // ---- 操作 ----
  el.cta.addEventListener("click", function(){
    var k = toKey(todayDate());
    if(data[k]) return; // 二度押し防止
    setRecord(k, true);
    render();
    // 押下後の現在ストリークで演出
    var s = calcStreak(data, todayDate());
    popStreak();
    if(MILESTONES.indexOf(s) !== -1){
      showBanner("🎉 " + s + "日達成!");
    }
  });
  el.undo.addEventListener("click", function(){
    var k = toKey(todayDate());
    setRecord(k, false);
    render();
  });
  el.yday.addEventListener("click", function(){
    var yd = new Date(todayDate()); yd.setDate(yd.getDate()-1);
    var k = toKey(yd);
    setRecord(k, !data[k]);   // 記録済みなら取り消し、未記録なら記録
    render();
    if(data[k]){
      // 昨日を足したことで今日までの連続記録が伸びる場合の演出
      var s = calcStreak(data, todayDate());
      popStreak();
      if(MILESTONES.indexOf(s) !== -1) showBanner("🎉 " + s + "日達成!");
    }
  });
  el.prev.addEventListener("click", function(){
    viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;}
    renderCalendar(todayDate());
  });
  el.next.addEventListener("click", function(){
    if(el.next.disabled) return;
    viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;}
    renderCalendar(todayDate());
  });

  // ---- バックアップ:書き出し ----
  el.exportBtn.addEventListener("click", function(){
    try{
      var payload = { type:"training-habit-backup", version:1, records:data };
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "training-backup-" + toKey(todayDate()) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){
      alert("書き出しに失敗しました。\nこの端末・ブラウザがファイル保存に対応していない可能性があります。\nお手数ですが別のブラウザでお試しください。");
    }
  });

  // ---- バックアップ:読み込み(マージ) ----
  el.importBtn.addEventListener("click", function(){
    el.importFile.click();
  });
  el.importFile.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    e.target.value = ""; // 同じファイルを再選択してもchangeが発火するように
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var incoming;
      try{
        var obj = JSON.parse(reader.result);
        // 新形式(records配下)・旧形式(生map)の両対応
        incoming = (obj && typeof obj === "object" && obj.records && typeof obj.records === "object")
          ? obj.records : obj;
      }catch(err){
        alert("読み込めませんでした。\n原因:ファイルがJSON形式として壊れています。\n対処:このアプリで書き出したバックアップファイルを選んでください。");
        return;
      }
      if(!incoming || typeof incoming !== "object"){
        alert("読み込めませんでした。\n原因:記録データが見つかりません。\n対処:このアプリで書き出したバックアップファイルを選んでください。");
        return;
      }
      // 実在する日付(YYYY-MM-DD)のキーだけを採用
      var validKeys = Object.keys(incoming).filter(function(k){
        return isValidDateKey(k) && incoming[k];
      });
      if(validKeys.length === 0){
        alert("読み込めませんでした。\n原因:有効な実施記録が1件も含まれていません。\n対処:このアプリで書き出したバックアップファイルを選んでください。");
        return;
      }
      // 今ない日付が何件増えるか数える
      var added = validKeys.filter(function(k){ return !data[k]; }).length;
      var ok = confirm("バックアップから "+validKeys.length+" 日分の記録を読み込みます。\n今の記録に追加(マージ)します(新規 "+added+" 日分)。\nよろしいですか?");
      if(!ok) return;
      // マージ(和集合)
      validKeys.forEach(function(k){ setRecord(k, true, true); }); // 送信は後でまとめて1回
      pushToCloud();
      render();
      alert("読み込みが完了しました。新しく "+added+" 日分を追加しました。");
    };
    reader.onerror = function(){
      alert("読み込めませんでした。\n原因:ファイルの読み取りに失敗しました。\n対処:もう一度ファイルを選び直してください。");
    };
    reader.readAsText(file);
  });

  // ---- メニューの曜日切り替え ----
  el.menuPrev.addEventListener("click", function(){
    viewDow = (viewDow + 6) % 7; // 前の曜日
    renderMenu();
  });
  el.menuNext.addEventListener("click", function(){
    viewDow = (viewDow + 1) % 7; // 次の曜日
    renderMenu();
  });
  el.menuToday.addEventListener("click", function(){
    viewDow = todayDate().getDay();
    renderMenu();
  });

  // ---- ステーション/サーキット切り替え ----
  el.modeStation.addEventListener("click", function(){
    if(viewMode === "station") return;
    viewMode = "station";
    saveMode(viewMode);
    renderMenu();
  });
  el.modeCircuit.addEventListener("click", function(){
    if(viewMode === "circuit") return;
    viewMode = "circuit";
    saveMode(viewMode);
    renderMenu();
  });

  // ---- 初期化 ----
  // 過去日の種目チェックは不要なので今日の分だけ残す
  (function cleanupChecks(){
    var allc = loadAllChecks();
    var tk = toKey(todayDate());
    var changed = false;
    Object.keys(allc).forEach(function(k){
      if(k !== tk){ delete allc[k]; changed = true; }
    });
    if(changed) saveAllChecks(allc);
  })();

  var t = todayDate();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
  viewDow = t.getDay(); // メニューは今日の曜日から開始
  viewMode = loadMode(); // 保存されたモード(既定:ステーション)
  render();
  renderMenu();

  if(!storageOK){
    el.streakMsg.textContent = "※このブラウザでは記録の保存ができません";
    el.streakMsg.className = "streak-msg calm";
  }
})();
</script>
</body>
</html>
